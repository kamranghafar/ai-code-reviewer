# AI Code Review — Standard Configuration
#
# Runs on every PR with standard review depth.

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: AI Code Review
        uses: kamranghafar/ai-code-reviewer@v1
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: 'gpt-4o-mini'
          review_level: 'standard'
          severity_threshold: 'info'
          post_summary: 'true'
